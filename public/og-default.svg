      <stop offset="0" stop-color="#1a1744"/>
      <stop offset="0.5" stop-color="#272566"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Brand mark -->
  <g transform="translate(80,80)">
    <rect width="96" height="96" rx="20" fill="#5145CD"/>
    <text x="48" y="68" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">ZF</text>
  </g>
  <text x="200" y="125" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">Iris Zimmerfrau Inc.</text>
  <text x="200" y="155" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a5b4fc">iriszf.com</text>

  <!-- Headline -->
  <text x="80" y="365" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-2">AI-Powered Business Systems</text>
  <text x="80" y="435" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-2">for Small Businesses</text>

  <!-- Tagline -->
