  <!-- Service tags -->
  <text x="80" y="565" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a5b4fc">AI Automation · Bookkeeping · GEO &amp; SEO · CRM · Marketing Automation</text>
